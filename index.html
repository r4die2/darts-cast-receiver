<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>CalcURate — табло</title>
  <link rel="stylesheet" href="style.css">
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <main class="scoreboard" aria-live="polite">
    <header class="scoreline" aria-label="Счёт по легам"><span id="left-legs">0</span><span>:</span><span id="right-legs">0</span></header>
    <section id="players" class="players" aria-label="Счёт игроков"></section>
    <footer class="footer"><span id="live-dot" class="live-dot"></span><span id="status">ОЖИДАНИЕ ПОДКЛЮЧЕНИЯ</span></footer>
  </main>
  <template id="player-template">
    <article class="player-card">
      <header class="player-heading"><h1 class="player-name"></h1><span class="elo"></span></header>
      <output class="remaining-value">—</output>
      <footer class="player-footer"><span class="average"></span><span class="darts"><span class="dart-icon">⌁</span><span class="darts-value"></span></span></footer>
    </article>
  </template>
  <script src="receiver.js"></script>
</body>
</html>

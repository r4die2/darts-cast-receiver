<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>CalcURate — табло</title>
  <link rel="stylesheet" href="style.css">
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <main class="scoreboard" aria-live="polite">
    <header class="scoreline" aria-label="Счёт по легам"><span id="left-legs">0</span><span>:</span><span id="right-legs">0</span></header>
    <section id="players" class="players" aria-label="Счёт игроков"></section>
    <section id="leg-win" class="leg-win" aria-live="assertive" hidden>
      <svg class="trophy" viewBox="0 0 96 96" aria-hidden="true"><path d="M28 12h40v19c0 18-8 29-20 29S28 49 28 31V12Zm0 8H13v7c0 13 7 20 18 21m37-28h15v7c0 13-7 20-18 21M48 60v14m-17 9h34M38 74h20v9H38z" /></svg>
      <p class="leg-win-label">ЛЕГ ВЫИГРАН</p>
      <h1 id="winner-name" class="winner-name"></h1>
      <p id="winner-visit" class="winner-visit" hidden></p>
      <div id="elo-results" class="elo-results" hidden>
        <p class="elo-result"><span id="elo-player-0" class="elo-player"></span><strong id="elo-change-0" class="elo-change"></strong></p>
        <p class="elo-result"><span id="elo-player-1" class="elo-player"></span><strong id="elo-change-1" class="elo-change"></strong></p>
      </div>
      <section id="bot-leg-details" class="bot-leg-details" hidden>
        <p class="bot-leg-title">ПОДХОДЫ БОТА ИЗ БАЗЫ</p>
        <p id="bot-tournament" class="bot-tournament"></p>
        <p id="bot-match-stage" class="bot-match-stage" hidden></p>
        <p class="bot-leg-stats"><span>AVG <strong id="bot-average"></strong></span><span>ДРОТИКИ <strong id="bot-darts"></strong></span></p>
        <div id="bot-visits" class="bot-visits" aria-label="Подходы бота"></div>
      </section>
    </section>
    <footer class="footer"><span id="live-dot" class="live-dot"></span><span id="status">ОЖИДАНИЕ ПОДКЛЮЧЕНИЯ</span></footer>
  </main>
  <template id="player-template">
    <article class="player-card">
      <header class="player-heading"><h1 class="player-name"></h1><span class="elo"></span></header>
      <output class="remaining-value">—</output>
      <footer class="player-footer"><span class="average"></span><span class="last-visit" hidden></span><span class="darts"><svg class="dart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21 16.5 7.5M3 21l4.5-1.5-3-3L3 21Zm12.5-12.5-1-4.5 3-2 1.2 4.8 4.3 1.2-2 3-4.5-1" /></svg><span class="darts-value"></span></span></footer>
    </article>
  </template>
  <script src="receiver.js"></script>
</body>
</html>
